name: mi_cuaderno_digital
description: Aplicación educativa tipo Classroom con Firebase y asistente IA.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  provider: ^6.1.2
  image_picker: ^1.1.2
  file_picker: ^8.3.1
  google_generative_ai: ^0.4.6
  intl: ^0.19.0
  path_provider: ^2.1.5
  csv: ^6.0.0
  shared_preferences: ^2.5.3
  http: ^1.6.0
  flutter_dotenv: ^5.0.2
  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
